name: PolarisLink CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest
          pip install -e "./python[pandas]" || pip install -e "./python"
      - name: Run pytest
        run: |
          pytest python/tests

  cpp-tests:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      - name: Install Clang & CMake
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake clang libcurl4-openssl-dev
      - name: Configure CMake
        run: |
          cmake -B build -S cpp -DCMAKE_CXX_COMPILER=clang++
      - name: Build and Test C++20 Header
        run: |
          cmake --build build
          ctest --test-dir build --output-on-failure
